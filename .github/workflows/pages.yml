name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'   # ดึงข้อมูลจาก Google Sheet ใหม่ทุก 15 นาที
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data.json from Google Sheet
        run: node scripts/build-data.js public/data.json
      - name: Stamp app version (มือถือจะอัปเดตแอปเองเมื่อเวอร์ชันเปลี่ยน)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" public/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
